{% if voucher_tabs %}
  <style>
    .voucher-type-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      width: 100%;
      gap: 0.25rem 0.15rem;
      padding: 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--app-border);
      border-radius: 0;
    }
    .voucher-type-tabs .nav-item {
      flex: 0 0 auto;
      display: flex;
    }
    .voucher-type-tabs .nav-link {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      width: auto;
      margin-bottom: -1px;
      text-align: center;
      white-space: nowrap;
      padding: 0.65rem 0.85rem;
      font-size: 0.875rem;
      font-weight: 400;
      color: #64748b !important;
      background: transparent !important;
      border: 0 !important;
      border-bottom: 2px solid transparent !important;
      border-radius: 0 !important;
    }
    .voucher-type-tabs .nav-link:hover {
      color: #0f172a !important;
      background: transparent !important;
    }
    .voucher-type-tabs .nav-link.active {
      font-weight: 600;
      color: #0f172a !important;
      background: transparent !important;
      border-bottom-color: var(--app-primary) !important;
    }
  </style>
  <ul class="nav voucher-type-tabs mb-3">
    {% for key, label in voucher_tabs %}
      <li class="nav-item">
        <a class="nav-link {% if vtype == key %}active{% endif %}" href="{% if entry_next %}{% url 'accounts_voucher_create' %}?type={{ key }}&amp;next={{ entry_next|urlencode }}{% else %}{% url 'accounts_voucher_list' %}?type={{ key }}{% endif %}">{{ label }}</a>
      </li>
    {% endfor %}
  </ul>
{% endif %}
